<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JVVNL K NO Finder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
html,body{width:100%;height:100%;background:radial-gradient(circle at 50% 0%,#334155 0%,#0f172a 100%);overflow:hidden}
.card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:92%;max-width:420px;background:#f1f5f9;padding:30px 20px;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.4);text-align:center}
.badge{display:inline-block;background:#e0f2fe;color:#0284c7;font-size:10px;font-weight:800;padding:6px 14px;border-radius:30px;margin-bottom:12px;letter-spacing:1px}
h2{color:#0f172a;font-size:24px;margin-bottom:4px;font-weight:900}
.sub{color:#64748b;font-size:10.5px;margin-bottom:24px;font-weight:700;letter-spacing:.8px}
.inp{margin-bottom:18px;text-align:left}
.inp label{display:block;font-size:11px;font-weight:800;color:#475569;margin-bottom:6px}
input{width:100%;padding:15px;font-size:16px;font-weight:700;border:2px solid #cbd5e1;border-radius:14px;outline:none}
button{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border:none;padding:16px;font-size:15px;font-weight:800;border-radius:14px;cursor:pointer;width:100%;text-transform:uppercase}
#result{margin-top:20px;font-size:14px;border-radius:14px}
.success{background:#0f172a;color:#fff;padding:20px;border-radius:14px;border:2px solid #38bdf8;text-align:center}
.lbl{font-size:10px;color:#38bdf8;margin-bottom:6px;font-weight:900;text-transform:uppercase}
.val{font-size:24px;font-weight:900;letter-spacing:1px}
.error{background:#fef2f2;color:#ef4444;border:2px solid #fecaca;padding:15px;border-radius:14px;font-weight:700;font-size:13px;text-align:center}
.wait{background:#f0f9ff;color:#0284c7;border:2px dashed #7dd3fc;padding:15px;border-radius:14px;font-weight:800;font-size:12px;text-align:center}
.foot{margin-top:24px;font-size:10.5px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:16px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="badge">JVVNL SUB-DIVISION</div>
  <h2>K NO FINDER</h2>
  <div class="sub">JAIPUR VIDYUT VITRAN NIGAM LIMITED, JVVNL</div>
  <div class="inp">
    <label>ENTER OLD K NUMBER</label>
    <input type="text" id="kno" placeholder="e.g. 210416041809" onkeypress="if(event.key==='Enter')findK()">
  </div>
  <button onclick="findK()">Search New K No</button>
  <div id="result"></div>
  <div class="foot">Created by: Manish Gurjar (AAO-II, JVVNL)</div>
</div>
<script>
let qKno="";
window.google={visualization:{Query:{setResponse:function(r){
  const d=document.getElementById('result');
  if(!r||!r.table){d.className='error';d.innerHTML="Sheet Access Error.";return;}
  for(const row of r.table.rows){
    if(row.c&&row.c[0]&&row.c[0].v!=null){
      if(String(row.c[0].f||row.c[0].v).trim().toLowerCase()===qKno){
        const n=row.c[1]?String(row.c[1].f||row.c[1].v).trim():"N/A";
        d.className='success';d.innerHTML='<div class="lbl">Your New K Number</div><div class="val">'+n+'</div>';return;
      }
    }
  }
  d.className='error';d.innerHTML="No New K Number found for Old K No: "+document.getElementById('kno').value.trim();
}}}};
function findK(){
  const v=document.getElementById('kno').value.trim(),d=document.getElementById('result');
  if(!v){d.className='error';d.innerHTML="Please enter a valid Old K Number.";return;}
  qKno=v.toLowerCase();d.className='wait';d.innerHTML="⚡ CONNECTING TO JVVNL DATABASE...";
  const old=document.getElementById('gs');if(old)old.remove();
  const s=document.createElement('script');s.id='gs';
  s.src="https://docs.google.com/spreadsheets/d/1LyNnlUsZ4xiEeu_m-BJO-xVJh1jGugv12aDDJiO_xJw/gviz/tq?tqx=out:json&_="+Date.now();
  s.onerror=function(){d.className='error';d.innerHTML="Ensure Google Sheet is shared as 'Anyone with link'.";};
  document.body.appendChild(s);
}
</script>
</body>
</html>
