<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डेटा सर्च पोर्टल</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            padding-top: 30px; 
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            width: 80%;
            max-width: 600px;
        }
        input { 
            padding: 10px; 
            font-size: 16px; 
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        iframe {
            width: 100%;
            height: 350px;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none; /* सर्च से पहले छिपा रहेगा */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>डेटा सर्च करें</h2>
        <p>अपना K-Number डालें:</p>

        <input type="text" id="oldNumber" placeholder="जैसे: 210413072145">
        <button onclick="searchData()">सर्च करें</button>

        <!-- रिजल्ट इस विंडो (Iframe) में दिखेगा -->
        <iframe id="resultFrame"></iframe>
    </div>

    <script>
        function searchData() {
            var num = document.getElementById("oldNumber").value;
            
            if(num === "") {
                alert("कृपया कोई नंबर डालें!");
                return;
            }

            // आका, यहाँ अपना वर्किंग Apps Script URL डालें
            var scriptUrl = "https://script.google.com/macros/s/AKfycbyYh1XdVq1u8Sj-J16AjYoRPmbJjpYUK2_ruvIbepZ659_lYF12rfn_SE_mhxGZQpxFCg/exec";
            
        
            var finalUrl = scriptUrl + "kno" + num; 

            var iframe = document.getElementById("resultFrame");
            iframe.src = finalUrl;
            iframe.style.display = "block"; // सर्च करते ही विंडो दिखने लगेगी
        }
    </script>
</body>
</html>
