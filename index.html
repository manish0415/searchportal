<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डेटा सर्च पोर्टल</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            padding-top: 50px; 
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        input { 
            padding: 10px; 
            font-size: 16px; 
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        #result { 
            margin-top: 20px; 
            font-size: 18px; 
            font-weight: bold; 
            color: #28a745; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>डेटा सर्च करें</h2>
        <p>अपना पुराना नंबर डालें और नया डेटा प्राप्त करें:</p>

        <input type="text" id="oldNumber" placeholder="पुराना नंबर यहाँ डालें">
        <button onclick="searchData()">सर्च करें</button>

        <div id="result"></div>
    </div>

    <script>
        function searchData() {
            var num = document.getElementById("oldNumber").value;
            var resultDiv = document.getElementById("result");

            if(num === "") {
                resultDiv.innerHTML = "<span style='color:red;'>कृपया कोई नंबर डालें!</span>";
                return;
            }

            resultDiv.innerHTML = "सर्च हो रहा है...";

            // मनीष, यहाँ नीचे अपनी Apps Script का URL डालें
            var scriptUrl = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

            fetch(scriptUrl + "?number=" + num)
            .then(response => response.text())
            .then(data => {
                resultDiv.innerHTML = "नया डेटा: " + data;
            })
            .catch(error => {
                resultDiv.innerHTML = "<span style='color:red;'>डेटा लाने में कोई समस्या हुई।</span>";
            });
        }
    </script>
</body>
</html>
