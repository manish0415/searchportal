<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डेटा सर्च पोर्टल</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            padding-top: 50px; 
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            width: 80%;
            max-width: 600px;
        }
        input { 
            padding: 10px; 
            font-size: 16px; 
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover { background-color: #0056b3; }
        #resultBox {
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fff;
            text-align: left;
            display: none; /* रिज़ल्ट आने से पहले छिपा रहेगा */
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>डेटा सर्च करें</h2>
        <p>अपना K-Number डालें:</p>

        <input type="text" id="oldNumber" placeholder="जैसे: 210413072145">
        <button onclick="searchData()">सर्च करें</button>

        <!-- सारा डेटा इसी बॉक्स में दिखेगा -->
        <div id="resultBox"></div>
    </div>

    <script>
        function searchData() {
            var num = document.getElementById("oldNumber").value;
            var resultBox = document.getElementById("resultBox");
            
            if(num === "") {
                alert("कृपया कोई नंबर डालें!");
                return;
            }

            // लोडिंग मेसेज दिखाएं
            resultBox.style.display = "block";
            resultBox.innerHTML = "<span style='color:#007bff;'>सर्च हो रहा है, कृपया प्रतीक्षा करें...</span>";

            // 1. आका, यहाँ अपना वर्किंग Apps Script URL डालें
            var scriptUrl = "https://script.google.com/macros/s/AKfycbyYh1XdVq1u8Sj-J16AjYoRPmbJjpYUK2_ruvIbepZ659_lYF12rfn_SE_mhxGZQpxFCg/exec?number=210413072145";
            
            // 2. लिंक में ?number= की जगह अपनी स्क्रिप्ट वाला पैरामीटर (जैसे ?kno=) कर लें
            var targetUrl = https://script.google.com/macros/s/AKfycbyYh1XdVq1u8Sj-J16AjYoRPmbJjpYUK2_ruvIbepZ659_lYF12rfn_SE_mhxGZQpxFCg/exec?number=210413072145 + "KNO" + num; 

            // 3. गूगल की रुकावट हटाने के लिए प्रॉक्सी (Proxy) का इस्तेमाल
            var proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

            fetch(proxyUrl)
            .then(response => response.text())
            .then(data => {
                // डेटा सीधा वेबसाइट के बॉक्स में आ जाएगा
                resultBox.innerHTML = data;
            })
            .catch(error => {
                resultBox.innerHTML = "<span style='color:red;'>डेटा लाने में समस्या हुई। कृपया दोबारा कोशिश करें।</span>";
            });
        }
    </script>
</body>
</html>
